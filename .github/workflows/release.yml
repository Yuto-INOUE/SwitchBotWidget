name: Release

on:
  push:
    tags: ["v*"]
  # タグを打つ前に成果物だけ確認したいとき用
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: タグとバージョン表記の一致を確認
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: node scripts/check-version.mjs "${{ github.ref_name }}"

      - name: テスト
        run: |
          npm test
          cargo test --locked

      - name: インストーラをビルド（自動更新用の署名つき）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 鍵にパスワードは設定していない
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run bundle

      - name: 成果物と latest.json を用意
        run: npm run release:prepare

      - name: 成果物を保存（タグ以外での実行時）
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: switchbot-widget
          path: artifacts/*

      - name: リリースを作成
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## インストール

            `SwitchBotWidget-x.y.z-x64-setup.exe` をダウンロードして実行してください。
            インストール不要で試すなら `-portable.exe` を直接起動できます。

            コード署名をしていないため、初回起動時に Windows SmartScreen の警告が出ます。
            「詳細情報」→「実行」で進めてください。

            起動後、SwitchBot アプリで取得したトークンとクライアントシークレットを入力すると使えます。

            インストーラ版は次のリリース以降、設定画面から自動更新できます
            （`latest.json` を同梱しているので、そこを見に行きます）。
